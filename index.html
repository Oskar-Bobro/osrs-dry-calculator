<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSRS Dry Calculator</title>
  </head>
  <body>
    <h1>OSRS Dry Calculator</h1>
    <p>Welcome to the OSRS Dry Calculator!</p>
    <label for="killsInput">Number of kills per hour:</label>
    <input
      type="number"
      id="killsInput"
      placeholder="Enter number of kills per hour"
    /><br />
    <label for="dropRate">Enter drop rate (e.g., 128):</label>
    <input type="number" id="dropRate" placeholder="Enter drop rate i.e. 128" />
    <p id="result">Result will appear here</p>
    <script src="script.js"></script>
  </body>
</html>
